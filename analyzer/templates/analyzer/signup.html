{% extends 'base.html' %}
{% block title %}Sign Up{% endblock %}
{% block content %}
<p style="color:blue;font-weight:bold;">DEBUG: signup.html loaded</p>
<h2>Sign Up</h2>
<form method="post">
  {% csrf_token %}
  {{ form.as_p }}
  <button type="submit" class="btn btn-primary">Sign Up</button>
</form>
<p>Already have an account? <a href="{% url 'analyzer:login' %}">Login here</a>.</p>
{% endblock %}
