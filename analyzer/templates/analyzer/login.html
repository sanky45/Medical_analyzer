{% extends 'base.html' %}
{% block title %}Login{% endblock %}
{% block content %}
<p style="color:blue;font-weight:bold;">DEBUG: login.html loaded</p>
<h2>Login</h2>
<form method="post">
  {% csrf_token %}
  {{ form.as_p }}
  <button type="submit" class="btn btn-primary">Login</button>
</form>
<p>Don't have an account? <a href="{% url 'analyzer:signup' %}">Sign up here</a>.</p>
{% endblock %}
