{% extends 'base.html' %}
{% block title %}Extracted Health Data Trends{% endblock %}
{% block content %}
<h2>Extracted Health Data Trends</h2>
<div class="row mb-3">
  <div class="col-md-4">
    <label for="parameter-select" class="form-label">Select Parameter:</label>
    <select id="parameter-select" class="form-select">
      {% for param in parameters %}
        <option value="{{ param }}">{{ param }}</option>
      {% endfor %}
    </select>
  </div>
  <div class="col-md-4">
    <label for="report1-select" class="form-label">Compare: Report 1</label>
    <select id="report1-select" class="form-select">
      <option value="">-- Select --</option>
      {% for r in report_options %}
        <option value="{{ r.id }}">{{ r.date }} - {{ r.name }}</option>
      {% endfor %}
    </select>
  </div>
  <div class="col-md-4">
    <label for="report2-select" class="form-label">Compare: Report 2</label>
    <select id="report2-select" class="form-select">
      <option value="">-- Select --</option>
      {% for r in report_options %}
        <option value="{{ r.id }}">{{ r.date }} - {{ r.name }}</option>
      {% endfor %}
    </select>
  </div>
</div>
<div id="comparison-table"></div>
<canvas id="trendChart" height="80"></canvas>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script>
const chartData = {{ chart_data_json|safe }};
const paramSelect = document.getElementById('parameter-select');
const report1Select = document.getElementById('report1-select');
const report2Select = document.getElementById('report2-select');
const ctx = document.getElementById('trendChart').getContext('2d');
let chart;

function toNumber(val) {
  const n = parseFloat(val);
  return isNaN(n) ? null : n;
}

function renderChart(parameter, report1, report2) {
  const data = chartData[parameter] || [];
  // Use {x, y} for all points, y as number or null
  const points = data.map(d => ({ x: d.date, y: toNumber(d.value) }));
  const unit = data.length > 0 ? data[0].unit : '';
  // Find points for selected reports (only if value exists)
  let report1Point = null, report2Point = null;
  if (report1) {
    const found = data.find(d => d.report_id == report1 && toNumber(d.value) !== null);
    if (found) report1Point = { x: found.date, y: toNumber(found.value) };
  }
  if (report2) {
    const found = data.find(d => d.report_id == report2 && toNumber(d.value) !== null);
    if (found) report2Point = { x: found.date, y: toNumber(found.value) };
  }
  if (chart) chart.destroy();
  chart = new Chart(ctx, {
    type: 'line',
    data: {
      labels: data.map(d => d.date),
      datasets: [
        {
          label: parameter + (unit ? ' (' + unit + ')' : ''),
          data: points,
          borderColor: '#2a5d84',
          backgroundColor: 'rgba(42,93,132,0.1)',
          tension: 0.3,
          pointRadius: 4,
          pointHoverRadius: 6,
          fill: true,
        },
      ],
    },
    options: {
      responsive: true,
      plugins: {
        legend: { display: true },
        title: { display: false },
      },
      scales: {
        x: { title: { display: true, text: 'Date' } },
        y: { title: { display: true, text: unit } },
      },
    },
  });
}

paramSelect.addEventListener('change', () => {
  renderChart(paramSelect.value, report1Select.value, report2Select.value);
});
report1Select.addEventListener('change', () => {
  renderChart(paramSelect.value, report1Select.value, report2Select.value);
});
report2Select.addEventListener('change', () => {
  renderChart(paramSelect.value, report1Select.value, report2Select.value);
});

// Initial render
renderChart(paramSelect.value, report1Select.value, report2Select.value);
</script>
{% endblock %}
