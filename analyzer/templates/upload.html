{% extends 'base.html' %}
{% block title %}Upload Report | Medical Analyzer{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-6">
    <div class="card shadow-card p-4" style="background:rgba(255,255,255,0.97);">
      <div class="text-center mb-3">
        <img src="https://cdn-icons-png.flaticon.com/512/2921/2921822.png" alt="Upload Report" width="64" height="64" class="rounded-circle shadow mb-2">
        <h2 class="fw-bold mb-3" style="color:#2a5d84;">Upload Medical Report</h2>
      </div>
      <img src="https://cdn.pixabay.com/photo/2016/03/31/19/56/medical-1295961_1280.png" alt="Upload Illustration" class="img-fluid rounded shadow mb-3" style="max-height:180px;object-fit:cover;">
      <form method="post" enctype="multipart/form-data" class="needs-validation" novalidate>
        {% csrf_token %}
        <div class="mb-3">
          <label for="id_file" class="form-label">Select PDF File</label>
          {{ form.file|as_widget:attrs }}
        </div>
        <div class="mb-3">
          <label for="id_description" class="form-label">Description (optional)</label>
          {{ form.description|as_widget:attrs }}
        </div>
        <button type="submit" class="btn btn-primary w-100 py-2">Upload</button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
