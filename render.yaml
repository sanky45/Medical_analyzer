services:
  - type: web
    name: medical-analyzer
    env: python
    buildCommand: |
      pip install -r requirements.txt
      python manage.py collectstatic --noinput
    startCommand: gunicorn medical_analyzer.wsgi:application \
      --bind 0.0.0.0:$PORT \
      --workers 1 \
      --threads 2 \
      --timeout 120
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: medical_analyzer.settings
      # Add your other environment variables here, e.g. for API keys
      # - key: GEMINI_API_KEY
      #   value: your-key-here
